# nginx for tx-bookings inside the container.
#
# The VPS's own nginx terminates TLS for bookings.texasrenters.com and proxies
# to the published port. This server block is plain HTTP on the internal
# network and is never published publicly.

# Deliberately NO real_ip_header / set_real_ip_from here.
#
# Rewriting $remote_addr from X-Forwarded-For would hand PHP-FPM the client's
# public IP as REMOTE_ADDR. Laravel's TrustProxies only honours forwarded
# headers when the immediate peer is trusted, so it would then discard
# X-Forwarded-Proto and generate http:// asset URLs on an https:// page --
# mixed content, and a blank page that still returns 200.
#
# Client IP resolution belongs to the framework, which reads the same header
# and gets it right. The access log still records the client via
# $http_x_forwarded_for.

# Docker's embedded DNS server. Required for the runtime upstream resolution
# in the PHP location block below.
#
# valid=2s, not 10s: this is how long nginx may keep sending requests to an
# app container that has already been retired. bin/deploy.sh also waits out
# this TTL before retiring the old container, so the two must stay in step.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # The team logo upload is validated at max:2048 (2MB) and multipart framing
    # adds a few percent. Keep at or above post_max_size in php.ini -- nginx
    # rejects with 413 before PHP is reached, so the smaller of the two is the
    # real limit.
    client_max_body_size 4M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Vite emits content-hashed filenames, so these can never go stale.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Team logos, served through the public/storage symlink into the shared
    # storage volume.
    #
    # try_files falls through to PHP rather than 404ing, because `local` in
    # config/filesystems.php sets `'serve' => true`. That registers a framework
    # route at /storage/{path} which streams from storage/app/private -- a
    # directory nginx cannot see and must not serve. A bare `expires` block
    # here would swallow those requests before they ever reached the route.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Resolved at request time, not at startup. nginx caches an upstream
        # given as a literal hostname for the life of the process, so during a
        # rolling deploy it would keep sending traffic to the IP of an app
        # container that no longer exists. Passing a variable forces nginx to
        # use the resolver, and Docker's embedded DNS returns the live set.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        # Inertia's AddLinkHeadersForPreloadedAssets emits one Link: header
        # naming every preloaded font, stylesheet and JS chunk. The default 4k
        # header buffer overflows on asset-heavy pages and nginx answers 502
        # "upstream sent too big header" while php-fpm is perfectly healthy.
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Keep in step with max_execution_time in php.ini and
        # request_terminate_timeout in www.conf, or one of the three truncates
        # the others.
        fastcgi_read_timeout 120s;
    }

    # FPM's own endpoints must not be reachable from outside the container.
    location ~ ^/(ping|status)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
