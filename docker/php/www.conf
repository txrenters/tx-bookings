; PHP-FPM pool tuning for tx-bookings.
;
; Loaded after the image's default www.conf, so these values win.
[www]
; The container runs as www-data already; declaring user/group here would make
; FPM warn that it cannot change identity as a non-root process.
listen = 9000

; /ping backs the container health check; /status is useful when debugging a
; wedged pool. Neither is reachable through nginx -- the server block denies
; both -- so they are only available over the FastCGI socket.
ping.path = /ping
ping.response = pong
pm.status_path = /status

pm = dynamic
; 6, matching texra-crm. This is the second application stack on a 7.8GiB box
; that also runs the host mysqld, and the traffic is internal scheduling plus
; public booking pages -- not high concurrency. 6 x 256M is the worst case to
; reason about; typical is a fraction of that.
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recycles workers periodically, which caps the damage any slow leak can do.
pm.max_requests = 500

; Slightly above max_execution_time in php.ini, so PHP's own limit fires first
; and produces a proper error rather than FPM killing the worker silently.
request_terminate_timeout = 150s

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
; env_file values must reach the application; clearing the environment would
; leave every config() call reading its default.
clear_env = no
