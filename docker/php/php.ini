; Production PHP settings for tx-bookings.

; 256M, matching texra-crm on the same box. Nothing in this app holds a large
; object graph in a request: there is no spreadsheet or PDF generation in the
; dependency tree, and the heaviest paths are the availability solver in
; ScheduleResolver and the Inertia prop payload.
;
; This is a per-request ceiling, not an allocation -- real RSS per FPM worker
; is well under 100M. The number that matters is pm.max_children x that.
memory_limit = 256M

; The only upload in the app is the team logo, validated at max:2048 (2MB) with
; a 2000x2000 dimension cap in SaveTeamRequest. Multipart framing adds a few
; percent. client_max_body_size in the nginx conf must be at least
; post_max_size, or nginx returns 413 before PHP sees the request and the
; validation message never renders.
upload_max_filesize = 3M
post_max_size = 4M

; Kept in step with fastcgi_read_timeout in the nginx conf -- whichever is
; lowest is the real limit, and a mismatch shows up as a 504 with no PHP error
; logged. The calendar syncs run as queued jobs, not requests.
;
; The CLI SAPI ignores this (it hardcodes 0), so the queue worker is bounded by
; its own --timeout instead.
max_execution_time = 120

expose_php = Off
; The application resolves per-user timezones itself; the PHP-level default
; stays UTC so anything that bypasses Carbon still stores UTC.
date.timezone = UTC

; Errors go to the container log, never to the response body.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code only changes when a new image is deployed, so never stat files for
; changes. Only safe because the application tree is immutable inside the
; image -- editing a file on the server changes nothing until a rebuild.
opcache.validate_timestamps = 0
